name: CI

# Consolidated CI workflow for LeanTrader-Bot.
# Replaces ci-basic.yml and python-tests.yml (delete those after this lands).
# Key change vs. old workflows: pytest failures are BLOCKING (no more `|| true`).

on:
  push:
    branches: [main, feature/ultra-defensive-router-tests-ci]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENABLE_LIVE: "false" # never hit live exchanges in CI
      PYTHONPATH: . # tests import root-level modules (e.g. `from router import ...`)
      SIGNALS_DEDUPE_WINDOW_SEC: "0" # matches conftest.py guard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run tests (blocking)
        run: pytest -q

      - name: Lint (non-blocking for now)
        continue-on-error: true
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
