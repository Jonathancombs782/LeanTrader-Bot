name: Import smoke

on:
  push:
  pull_request:

jobs:
  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt beautifulsoup4
      - name: Run import smoke (fail on any import error)
        env:
          PYTHONPATH: .
        run: python .github/scripts/import_smoke.py
