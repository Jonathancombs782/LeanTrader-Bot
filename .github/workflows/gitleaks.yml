name: Gitleaks

# Secrets scanner: runs on every push and PR.
# Prevents recurrence of the committed .env / .env.recover exposure.
# NOTE: this does NOT clean history — rotate keys and purge history first (Phase 0).

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan all commits

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
