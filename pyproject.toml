[project]
name = "leantrader"
version = "0.1.0"
description = "LeanTrader: evolving FX bot with DSL, RAG research, GA alpha factory, and meta-routing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "requests>=2.31.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0.0",
  "ccxt>=4.3.0",
  "MetaTrader5>=5.0.45",
  "fastapi>=0.103.1",
  "uvicorn>=0.23.2",
  "redis>=4.6.0",
  "cryptography>=43.0",
  "PyNaCl",
  "portalocker",
  "matplotlib>=3.6",
  "mplfinance",
  "Pillow>=10.2",
  "jinja2",
  "feedparser",
  "beautifulsoup4>=4.12",
  "cvxpy",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
torch = ["torch"]
tensorflow = ["tensorflow"]
gym = ["gym"]
sb3 = ["stable-baselines3"]
transformers = ["transformers"]
kivy = ["kivy"]
qiskit = ["qiskit"]
openai = ["openai"]
optuna = ["optuna"]
xgboost = ["xgboost"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
extend-exclude = '''
(
  ^\.venv/
| ^runtime/
| ^tools/experimental/
)
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "runtime"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "runtime", "runtime/backups", "_incoming", "build", "dist", "**/*.ipynb", "src/leantrader/**/notebooks"]
fix = true

[tool.ruff.lint]
extend-select = ["E", "F", "W"]
ignore = ["E203", "E501"]  # ignore long line errors for now to speed up fixes
unfixable = ["E711", "E712"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402", "F401", "F841", "E741"]
"runtime/*.py" = ["E402", "F401", "F841"]
"tests/*.py" = ["E402", "F401", "F841"]
"src/leantrader/features/ta.py" = ["E741", "F841"]
"tools/close_open_trades.py" = ["F821"]
"tools/web_crawler.py" = ["F811"]
